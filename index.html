

<!DOCTYPE html>
<html>
<head>
<title>Free Data Dialog</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  background: #101827;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 25px;
}

h1 { color: #00e5ff; }

.quiz {
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
}

button {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border: none;
  border-radius: 8px;
  background: #087e8b;
  color: white;
  font-size: 16px;
}
</style>
</head>

<body>

<h1>🔐 Free With Dialog</h1>

<div class="quiz">
  <h2 id="question">Loading...</h2>

  <div id="answers"></div>

  <p id="result"></p>
  <p id="score"></p>

  <button id="next" onclick="nextQuestion()">
    Next Question
  </button>
</div>

<script>
const questions = [
  {
    q: "Should you share your OTP?",
    a: ["Yes", "No", "Sometimes"],
    correct: 1
  },
  {
    q: "What does HTTPS help provide?",
    a: ["A secure connection", "Free data", "More battery"],
    correct: 0
  },
  {
    q: "What is phishing?",
    a: ["A game", "An online scam", "A browser"],
    correct: 1
  }
];

let current = 0;
let points = 0;
let answered = false;

function showQuestion() {
  answered = false;
  document.getElementById("question").textContent =
    questions[current].q;

  document.getElementById("result").textContent = "";
  document.getElementById("score").textContent =
    "Score: " + points;

  const area = document.getElementById("answers");
  area.innerHTML = "";

  questions[current].a.forEach((answer, index) => {
    const btn = document.createElement("button");
    btn.textContent = answer;
    btn.onclick = () => checkAnswer(index);
    area.appendChild(btn);
  });

  document.getElementById("next").textContent =
    current === questions.length - 1 ? "Finish Quiz" : "Next Question";
}

function checkAnswer(index) {
  if (answered) return;
  answered = true;

  if (index === questions[current].correct) {
    points++;
    document.getElementById("result").textContent =
      "Correct! 🎉";
  } else {
    document.getElementById("result").textContent =
      "Not quite! Try the next question.";
  }

  document.getElementById("score").textContent =
    "Score: " + points;

}

function nextQuestion() {
  if (!answered) {
    document.getElementById("result").textContent =
      "Please choose an answer first!";
    return;
  }

  current++;

  if (current >= questions.length) {
    document.querySelector(".quiz").innerHTML =
      "<h2>Quiz Completed! 🎉</h2>" +
      "<h3>Your Score: " + points + " / " +
      questions.length + "</h3>" +
      "<button onclick='location.reload()'>Play Again</button>";
    return;
  }

  showQuestion();
}

showQuestion();
</script>

</body>
</html>
